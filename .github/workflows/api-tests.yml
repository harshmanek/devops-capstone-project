name: API Integration Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC

jobs:
  api-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_123
          MYSQL_DATABASE: microservices_db
          MYSQL_USER: devops_user
          MYSQL_PASSWORD: devops_password_123
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-sqlalchemy pymysql python-dotenv gunicorn werkzeug requests flask-cors prometheus-flask-exporter

    - name: Start services with Docker Compose
      run: docker-compose up -d
  
    - name: Wait for services to be healthy
      run: |
        for i in {1..60}; do
          if curl -f http://localhost:5001/health && \
             curl -f http://localhost:5002/health && \
             curl -f http://localhost:5003/health; then
            echo "✓ All services healthy"
            break
          fi
          echo "Waiting for services... ($i/60)"
          sleep 1
        done
    
    - name: Run comprehensive tests
      run: bash test_all_services.sh
      
    - name: Health Check
      run: |
        sleep 5
        curl -f http://localhost:5001/health || exit 1
        curl -f http://localhost:5002/health || exit 1
        curl -f http://localhost:5003/health || exit 1
        echo "✓ All services healthy"
    
    - name: Run comprehensive tests
      run: bash test_all_services.sh

